# Déploiement en un clic sur Render (Blueprint).
services:
  - type: web
    name: tehis-prototype
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Code d'invitation demandé à l'inscription (bêta privée). Vide = inscription ouverte.
      - key: CODE_INVITATION
        sync: false
      # Ton numéro : le compte créé avec ce numéro devient administrateur.
      - key: ADMIN_TELEPHONE
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Paiement des offres par Chariow (facultatif, voir docs/PAIEMENT.md).
      - key: CHARIOW_API_KEY
        sync: false
      - key: CHARIOW_PULSE_SECRET
        sync: false
      - key: CHARIOW_PRODUIT_PLUS
        sync: false
      - key: CHARIOW_PRODUIT_PRO
        sync: false
      # Voix naturelle et transcription (facultatif).
      - key: OPENAI_API_KEY
        sync: false
      # WhatsApp (facultatif, voir docs/WHATSAPP.md).
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: ANTHROPIC_MODEL_LEGER
        value: claude-haiku-4-5-20251001
      # Offre des nouveaux comptes (modifiable ensuite par compte dans Réglages › Testeurs).
      - key: OFFRE_DEFAUT
        value: gratuit
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tehis-db
          property: connectionString

  # Site de prélancement (liste d'attente). Partage la base de l'app.
  - type: web
    name: tehis-site
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: node site/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: APP_URL
        value: https://tehis-prototype.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: tehis-db
          property: connectionString

databases:
  - name: tehis-db
    plan: free
    region: frankfurt
