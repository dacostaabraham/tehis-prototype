# Déploiement en un clic sur Render (Blueprint).
services:
  - type: web
    name: tehis-prototype
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: ANTHROPIC_MODEL_LEGER
        value: claude-haiku-4-5-20251001
      - key: OFFRE_TEST
        value: pro
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tehis-db
          property: connectionString

databases:
  - name: tehis-db
    plan: free
    region: frankfurt
